[project]
name = "paralegal"
version = "0.1.0"
description = "Document understanding, grounded retrieval, legal memo drafting, and edit-learning demo."
requires-python = ">=3.12"
dependencies = [
  "pypdf>=6.0.0,<7.0.0",
  "reportlab>=4.2.0,<5.0.0",
  "streamlit>=1.38.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0.0"]

[project.scripts]
paralegal = "paralegal.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paralegal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
